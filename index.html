<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheShruti 🦋✨</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 35%, #173b32 0%, #0b241e 38%, #04110e 100%);
      color: #e8fff1;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 560px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Soft animated glow */
    .glow {
      position: absolute;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      background: rgba(108, 255, 170, 0.08);
      filter: blur(45px);
      animation: breathe 5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.9); opacity: .55; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    /* Stars / particles */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #caffdf;
      box-shadow: 0 0 10px rgba(202, 255, 223, .9);
      opacity: .65;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(110vh) scale(.5);
      }
      to {
        transform: translateY(-15vh) scale(1.2);
      }
    }

    /* Butterflies */
    .butterfly {
      position: absolute;
      font-size: clamp(22px, 6vw, 42px);
      filter: drop-shadow(0 0 9px rgba(183,255,215,.7));
      animation: fly linear infinite;
      pointer-events: none;
    }

    .b1 { left: -10%; top: 18%; animation-duration: 15s; }
    .b2 { left: -15%; top: 68%; animation-duration: 20s; animation-delay: -7s; font-size: 30px; }
    .b3 { left: -10%; top: 42%; animation-duration: 24s; animation-delay: -12s; font-size: 24px; }

    @keyframes fly {
      0%   { transform: translateX(-10vw) translateY(0) rotate(-8deg); }
      25%  { transform: translateX(35vw) translateY(-35px) rotate(8deg); }
      50%  { transform: translateX(70vw) translateY(30px) rotate(-5deg); }
      75%  { transform: translateX(105vw) translateY(-25px) rotate(8deg); }
      100% { transform: translateX(125vw) translateY(10px) rotate(-4deg); }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 5;
      width: min(92%, 720px);
      padding: clamp(28px, 7vw, 55px) clamp(20px, 7vw, 60px);
      text-align: center;
      border: 1px solid rgba(205, 255, 225, .18);
      border-radius: 28px;
      background: rgba(3, 20, 15, .48);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        0 20px 80px rgba(0, 0, 0, .45),
        inset 0 0 35px rgba(135, 255, 180, .035);
      animation: cardIn 1.4s ease-out both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(25px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .intro {
      color: #a9e8c1;
      font-size: clamp(13px, 3.5vw, 16px);
      letter-spacing: 3px;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: .5s;
    }

    .title {
      font-size: clamp(38px, 12vw, 76px);
      line-height: 1;
      color: #e9fff2;
      text-shadow: 0 0 25px rgba(168, 255, 200, .25);
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1s;
    }

    .title span {
      color: #91eeb3;
    }

    .poem {
      min-height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(17px, 4.8vw, 25px);
      line-height: 1.75;
      color: #e1f9e9;
      text-shadow: 0 0 12px rgba(166, 255, 200, .12);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      margin-left: 4px;
      vertical-align: -2px;
      background: #9ff2bb;
      animation: blink .8s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .signature {
      margin-top: 30px;
      color: #9ff2bb;
      font-size: clamp(19px, 5vw, 27px);
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 8s;
    }

    .tagline {
      margin-top: 10px;
      color: #8bbca0;
      font-size: clamp(12px, 3.5vw, 15px);
      letter-spacing: 1.5px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 9s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .replay {
      margin-top: 24px;
      padding: 9px 18px;
      border: 1px solid rgba(180, 255, 205, .28);
      border-radius: 999px;
      background: rgba(140, 255, 180, .06);
      color: #bfffd1;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: .25s ease;
    }

    .replay:hover,
    .replay:active {
      background: rgba(140, 255, 180, .14);
      transform: translateY(-2px);
    }

    .footer {
      position: absolute;
      bottom: 14px;
      left: 0;
      width: 100%;
      text-align: center;
      color: rgba(190, 230, 205, .45);
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      z-index: 5;
    }

    @media (max-height: 650px) {
      .card { padding-top: 24px; padding-bottom: 24px; }
      .title { margin-bottom: 18px; }
      .poem { min-height: 145px; }
      .signature { margin-top: 16px; }
    }
  </style>
</head>

<body>

  <main class="scene">

    <div class="glow"></div>

    <!-- Floating particles -->
    <span class="particle" style="left:8%; animation-duration:9s; animation-delay:-2s;"></span>
    <span class="particle" style="left:18%; animation-duration:12s; animation-delay:-7s;"></span>
    <span class="particle" style="left:31%; animation-duration:10s; animation-delay:-4s;"></span>
    <span class="particle" style="left:47%; animation-duration:14s; animation-delay:-10s;"></span>
    <span class="particle" style="left:61%; animation-duration:11s; animation-delay:-5s;"></span>
    <span class="particle" style="left:76%; animation-duration:13s; animation-delay:-8s;"></span>
    <span class="particle" style="left:90%; animation-duration:10s; animation-delay:-3s;"></span>

    <!-- Floating butterflies -->
    <div class="butterfly b1">🦋</div>
    <div class="butterfly b2">🦋</div>
    <div class="butterfly b3">🦋</div>

    <section class="card">

      <div class="intro">🌱 A LITTLE REMINDER 🌱</div>

      <h1 class="title">The<span>Shruti</span> 🦋</h1>

      <div class="poem">
        <span id="poemText"></span><span class="cursor"></span>
      </div>

      <div class="signature">💅 TheShruti ✨</div>
      <div class="tagline">Be you. Be misaal. 🌙</div>

      <button class="replay" onclick="startAnimation()">↻ Replay</button>

    </section>

    <div class="footer">made with 🌿 &nbsp; • &nbsp; TheShruti</div>

  </main>

  <script>
    const lines = [
      "🌙 Tu be-misaal hai, teri kya misaal doon...",
      "✨ Aasmaan se aayi hai, yehi keh ke taal doon...",
      "🦋 Phir bhi koi jo pooche, kya hai tu... kaisi hai...",
      "🎨 Haathon mein rang leke, hawaa mein uchaal doon..."
    ];

    const poemText = document.getElementById("poemText");

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function typeLine(text) {
      poemText.textContent = "";

      for (const char of text) {
        poemText.textContent += char;
        await sleep(48);
      }

      await sleep(850);
    }

    async function startAnimation() {
      poemText.textContent = "";

      for (const line of lines) {
        await typeLine(line);
      }
    }

    window.addEventListener("load", () => {
      setTimeout(startAnimation, 1700);
    });
  </script>

</body>
</html>
